{{/* Kirari Friend Link Card */}}
<a href="{{ .url }}" target="_blank" rel="noopener noreferrer"
  class="card-base group flex items-center gap-4 p-4 no-underline hover:shadow-md transition-all duration-300">
  {{/* Avatar */}}
  {{ with .avatar }}
  <img src="{{ . }}" alt="{{ $.name }}" loading="lazy"
    class="w-14 h-14 rounded-xl object-cover shrink-0 transition-transform duration-300 group-hover:scale-105">
  {{ else }}
  <div class="w-14 h-14 rounded-xl bg-[var(--btn-regular-bg)] flex items-center justify-center shrink-0 text-2xl font-bold text-50">
    {{ substr .name 0 1 | upper }}
  </div>
  {{ end }}

  {{/* Info */}}
  <div class="flex flex-col min-w-0">
    <span class="font-bold text-90 group-hover:text-[var(--primary)] transition-colors truncate">
      {{ .name }}
    </span>
    {{ with .description }}
    <span class="text-sm text-50 line-clamp-2 mt-0.5">{{ . }}</span>
    {{ end }}
  </div>

  {{/* External link icon */}}
  <div class="ml-auto text-50 group-hover:text-[var(--primary)] transition-colors shrink-0">
    {{ partial "icon.html" (dict "name" "external-link" "class" "w-4 h-4") }}
  </div>
</a>
