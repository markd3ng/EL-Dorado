{{/* Kirari Categories Widget */}}
{{ $categories := site.Taxonomies.categories }}
{{ if $categories }}
<div class="card-base p-4" data-widget="categories">
  {{/* Header with collapse toggle */}}
  <button class="widget-toggle flex items-center justify-between w-full text-left" aria-expanded="true">
    <span class="text-sm font-bold text-75 flex items-center gap-2">
      {{ partial "icon.html" (dict "name" "folder" "class" "w-4 h-4") }}
      {{ i18n "categories" | default "Categories" }}
    </span>
    <span class="widget-arrow transition-transform duration-200 text-50">
      {{ partial "icon.html" (dict "name" "chevron-down" "class" "w-4 h-4") }}
    </span>
  </button>

  {{/* Content */}}
  <div class="widget-content mt-3 flex flex-col gap-1" style="max-height: 400px;">
    {{ range $name, $taxonomy := $categories }}
    <a href="{{ `/categories/` | relURL }}{{ $name | urlize }}/"
      class="flex items-center justify-between px-2 py-1.5 rounded-lg text-sm text-75 no-underline
      hover:bg-[var(--btn-plain-bg-hover)] transition-colors duration-200">
      <span>{{ $name }}</span>
      <span class="text-xs text-50 bg-[var(--btn-regular-bg)] rounded-full px-2 py-0.5">{{ len $taxonomy.Pages }}</span>
    </a>
    {{ end }}
  </div>
</div>
{{ end }}
