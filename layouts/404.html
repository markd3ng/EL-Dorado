{{ define "main" }}
<div class="card-base p-12 flex flex-col items-center justify-center text-center gap-4">
  <span class="text-6xl font-bold text-[var(--primary)]">404</span>
  <p class="text-xl text-75">{{ i18n "pageNotFound" | default "Page not found" }}</p>
  <p class="text-sm text-50">{{ i18n "pageNotFoundDesc" | default "The page you are looking for does not exist." }}</p>
  <a href="{{ "/" | relURL }}" class="btn-regular px-6 py-2.5 rounded-lg text-sm font-medium no-underline mt-2 gap-2">
    {{ partial "icon.html" (dict "name" "home" "class" "w-4 h-4") }}
    {{ i18n "backHome" | default "Back to Home" }}
  </a>
</div>
{{ end }}
