{{/* Kirari Search Panel (Mobile) */}}
{{ if site.Params.search.enable | default true }}
<div id="search-overlay" class="panel-overlay hidden md:hidden" aria-hidden="true"></div>
<div id="search-panel" class="slide-panel inset-x-4 top-24 rounded-[var(--radius-large)] translate-y-[-120%] mx-auto max-w-lg md:hidden"
  style="position: fixed;">
  <div class="p-4 flex flex-col">
    {{/* Search input */}}
    <div class="relative">
      <input id="search-input-mobile" type="text"
        placeholder="{{ i18n "searchPlaceholder" | default "Search articles..." }}"
        class="w-full h-10 pl-10 pr-3 rounded-lg text-sm
        bg-[var(--btn-regular-bg)] text-75 placeholder:text-50
        focus:outline-none focus:ring-2 focus:ring-[var(--primary)]/30"
        autocomplete="off">
      <span class="absolute left-3 top-1/2 -translate-y-1/2 text-50">
        {{ partial "icon.html" (dict "name" "search" "class" "w-4 h-4") }}
      </span>
    </div>
    {{/* Search results container */}}
    <div id="search-results-mobile" class="flex flex-col gap-1 max-h-64 overflow-y-auto mt-3">
    </div>
  </div>
</div>
{{ end }}
