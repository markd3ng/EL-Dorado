{{/* Kirari Footer */}}
<footer class="w-full max-w-[var(--page-width)] mx-auto px-4 mt-8">
  <div class="card-base p-6 flex flex-col md:flex-row items-center justify-between gap-4 text-sm text-50">
    <div class="flex items-center gap-1">
      <span>&copy; {{ now.Year }} {{ site.Params.author | default site.Title }}</span>
    </div>
    <div class="flex items-center gap-4">
      <span>Powered by <a href="https://gohugo.io" target="_blank" rel="noopener noreferrer" class="link">Hugo</a></span>
      <span class="meta-divider">|</span>
      <span>Theme <a href="https://github.com/markd3ng/KIRARI" target="_blank" rel="noopener noreferrer" class="link">Kirari</a></span>
      {{ with .OutputFormats.Get "rss" }}
      <a href="{{ .Permalink }}" class="btn-plain" aria-label="RSS">
        {{ partial "icon.html" (dict "name" "rss" "class" "w-4 h-4") }}
      </a>
      {{ end }}
    </div>
  </div>
  <div class="h-6"></div>
</footer>
