{{/* Kirari TOC — right sidebar on 2xl screens */}}
{{ if .TableOfContents }}
<div id="toc-container" class="card-base p-4">
  <div class="text-sm font-bold text-75 flex items-center gap-2 mb-3">
    {{ partial "icon.html" (dict "name" "book-open" "class" "w-4 h-4") }}
    {{ i18n "tableOfContents" | default "Table of Contents" }}
  </div>
  <nav class="toc-nav text-sm max-h-[60vh] overflow-y-auto pr-2"
    style="-webkit-mask-image: linear-gradient(to bottom, transparent 0, black 1rem, black calc(100% - 1rem), transparent 100%);">
    {{ .TableOfContents }}
  </nav>
</div>
{{ end }}
