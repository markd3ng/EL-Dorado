baseURL = "https://el-dorado-7okp.vercel.app/"
languageCode = "en"
title = "KIRARI"
theme = ".."
paginate = 5
enableRobotsTXT = true

[build]
  [build.buildStats]
    enable = true
  [[build.cachebusters]]
    source = 'assets/notwatching/hugo_stats\.json'
    target = 'css'
  [[build.cachebusters]]
    source = '(postcss|tailwind)\.config\.js'
    target = 'css'

[module]
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    disableWatch = true
    source = "hugo_stats.json"
    target = "assets/notwatching/hugo_stats.json"

[markup]
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4
    ordered = false
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[taxonomies]
  category = "categories"
  tag = "tags"

[params]
  author = "Lorem Ipsum"
  description = "A demo site for the Kirari Hugo theme"
  bio = "Lorem ipsum dolor sit amet, consectetur adipiscing elit."

  themeHue = 250
  themeHueFixed = false
  avatar = "images/avatar.png"

  [params.banner]
    enable = true
    src = "images/banner.png"
    position = "center"
    [params.banner.credit]
      enable = true
      text = "Photo by Unsplash"
      url = "https://unsplash.com"

  [params.toc]
    enable = true
    depth = 3

  [params.license]
    enable = true
    name = "CC BY-NC-SA 4.0"
    url = "https://creativecommons.org/licenses/by-nc-sa/4.0/"

  [[params.social]]
    name = "GitHub"
    url = "https://github.com"
    icon = "github"

  [[params.social]]
    name = "Twitter"
    url = "https://twitter.com"
    icon = "twitter"

  [[params.social]]
    name = "RSS"
    url = "/index.xml"
    icon = "rss"

  [params.comments]
    provider = ""
    [params.comments.giscus]
      repo = ""
      repoId = ""
      category = ""
      categoryId = ""
      mapping = "pathname"
    [params.comments.waline]
      serverURL = ""

  [params.search]
    enable = true

[[menus.main]]
  name = "Home"
  url = "/"
  weight = 1
  [menus.main.params]
    icon = "home"

[[menus.main]]
  name = "Archive"
  url = "/archive/"
  weight = 2
  [menus.main.params]
    icon = "archive"

[[menus.main]]
  name = "About"
  url = "/about/"
  weight = 3
  [menus.main.params]
    icon = "user"

[[menus.main]]
  name = "Friends"
  url = "/friends/"
  weight = 4
  [menus.main.params]
    icon = "users"
